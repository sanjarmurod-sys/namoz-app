name: Kanal jadvali
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr python3-pil
      - run: python3 scripts/fetch_times.py
      - name: Saqlash
        run: |
          git config user.name "jadval-bot"
          git config user.email "bot@users.noreply.github.com"
          git add times.json
          git diff --cached --quiet || (git commit -m "Namoz jadvali yangilandi" && git push)
